name: Registre

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: registre-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - run: npm ci

      # Schémas, vocabulaire contrôlé, et surtout parité stricte des variables
      # entre les deux locales : c'est ce contrôle qui empêche un formulaire de
      # différer selon la langue.
      - name: Valider la source
        run: npm run validate

      # Les artefacts servis au site doivent refléter la source à l'octet près.
      - name: Vérifier les artefacts générés
        run: |
          npm run build
          node scripts/check-artifacts.mjs
